services:
  web:
    image: php:8.2-apache
    container_name: gradix_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=gradix_user
      - DB_PASS=gradix_pass
      - DB_NAME=gradix
    depends_on:
      - db
    # We need to install pdo_mysql extension for PHP to connect to MySQL
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql mysqli && apache2-foreground"

  db:
    image: mysql:8.0
    container_name: gradix_db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=gradix
      - MYSQL_USER=gradix_user
      - MYSQL_PASSWORD=gradix_pass
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gradix_pma
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
    depends_on:
      - db

volumes:
  db_data:
