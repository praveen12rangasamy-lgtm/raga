<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Raga Boutique</title>
  <link rel="icon" type="image/png" href="images/raga_favicon.png">
  <meta name="robots" content="noindex, nofollow">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              burgundy: '#702152',
              burgundyLight: '#8b2968',
              gold: '#d4b270',
              goldDark: '#bfa061',
              cream: '#faf6f0',
              charcoal: '#2c2c2c',
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }

    .bg-plum-gradient {
      background: linear-gradient(135deg, #702152 0%, #4a1539 40%, #2d0d24 100%);
    }

    .login-card {
      backdrop-filter: blur(10px);
      box-shadow: 0 25px 60px rgba(0,0,0,0.35), 0 0 0 1px rgba(212,178,112,0.15);
    }

    .input-field {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(212,178,112,0.25);
      color: white;
      transition: all 0.2s ease;
    }
    .input-field::placeholder { color: rgba(255,255,255,0.4); }
    .input-field:focus {
      outline: none;
      border-color: #d4b270;
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 0 3px rgba(212,178,112,0.15);
    }

    .btn-login {
      background: #d4b270;
      color: #702152;
      font-weight: 700;
      letter-spacing: 0.12em;
      transition: all 0.25s ease;
      border-bottom: 3px solid #bfa061;
    }
    .btn-login:hover {
      background: #bfa061;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(212,178,112,0.3);
    }
    .btn-login:active { transform: translateY(0); }

    .ornament { opacity: 0.08; pointer-events: none; user-select: none; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards; }

    .shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60%  { transform: translateX(-8px); }
      40%,80%  { transform: translateX(8px); }
    }

    .eye-btn { color: rgba(255,255,255,0.45); transition: color 0.2s; cursor: pointer; background: none; border: none; }
    .eye-btn:hover { color: #d4b270; }
  </style>
</head>
<body class="bg-plum-gradient min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Decorative Background -->
  <div class="absolute inset-0 flex items-center justify-center select-none pointer-events-none">
    <div class="font-serif text-white" style="font-size: clamp(200px, 40vw, 480px); line-height:1; opacity:0.04;">&#x0930;&#x093E;&#x0917;&#x093E;</div>
  </div>
  <div class="absolute top-0 left-0 w-72 h-72 rounded-full" style="background: radial-gradient(circle, rgba(212,178,112,0.12) 0%, transparent 70%); transform: translate(-30%, -30%); pointer-events:none;"></div>
  <div class="absolute bottom-0 right-0 w-96 h-96 rounded-full" style="background: radial-gradient(circle, rgba(212,178,112,0.08) 0%, transparent 70%); transform: translate(30%, 30%); pointer-events:none;"></div>

  <!-- Login Card -->
  <div class="login-card fade-up w-full max-w-md rounded-2xl overflow-hidden" style="background: rgba(45,13,36,0.75);">

    <!-- Card Header -->
    <div class="px-10 pt-10 pb-6 text-center border-b border-white/5">
      <div class="flex justify-center mb-5">
        <img src="images/raga_logo.png" alt="Raga Boutique" class="h-14 object-contain"
          onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block'">
        <h1 id="logo-text" class="font-serif text-3xl font-bold text-brand-gold" style="display:none;">Raga</h1>
      </div>
      <span class="inline-block text-[10px] uppercase tracking-[0.3em] text-brand-gold/70 font-semibold mb-1.5">Admin Portal</span>
      <h2 class="font-serif text-2xl font-bold text-white">Welcome Back</h2>
      <p class="text-white/40 text-xs mt-1.5">Sign in to manage your boutique</p>
    </div>

    <!-- Form -->
    <div class="px-10 py-8">
      <form id="login-form" onsubmit="handleLogin(event)" novalidate>

        <!-- Username -->
        <div class="mb-5">
          <label for="username" class="block text-xs font-semibold uppercase tracking-widest text-brand-gold/80 mb-2">Username</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-brand-gold/50 pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </span>
            <input type="text" id="username" name="username" placeholder="Enter username"
              class="input-field w-full pl-10 pr-4 py-3 rounded-lg text-sm"
              autocomplete="username" required>
          </div>
        </div>

        <!-- Password -->
        <div class="mb-6">
          <label for="password" class="block text-xs font-semibold uppercase tracking-widest text-brand-gold/80 mb-2">Password</label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-brand-gold/50 pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Enter password"
              class="input-field w-full pl-10 pr-10 py-3 rounded-lg text-sm"
              autocomplete="current-password" required>
            <button type="button" id="toggle-password" class="eye-btn absolute right-3.5 top-1/2 -translate-y-1/2" onclick="togglePassword()" aria-label="Toggle password visibility">
              <svg id="eye-icon-show" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg id="eye-icon-hide" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Error Message -->
        <div id="error-msg" class="hidden mb-4 px-4 py-3 rounded-lg text-xs font-semibold text-red-200 flex items-center gap-2"
          style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.25);">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 text-red-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <span id="error-text">Invalid username or password.</span>
        </div>

        <!-- Submit -->
        <button type="submit" id="submit-btn" class="btn-login w-full py-3.5 rounded-lg text-xs uppercase tracking-[0.18em]">
          Sign In to Admin Panel
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="index.html" class="text-xs text-white/30 hover:text-brand-gold/60 transition duration-200 inline-flex items-center gap-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Back to Raga Boutique
        </a>
      </div>
    </div>

    <div class="px-10 py-4 text-center border-t border-white/5" style="background: rgba(0,0,0,0.2);">
      <p class="text-white/20 text-[10px] tracking-wider uppercase">Raga Boutique &bull; Admin Portal &bull; Restricted Access</p>
    </div>
  </div>

  <script>
    // Auth guard — if already logged in, skip to admin
    if (sessionStorage.getItem('raga_admin_auth') === 'true') {
      window.location.href = 'admin.html';
    }

    const ADMIN_CREDENTIALS = { username: 'admin', password: 'raga@admin2024' };

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-msg');
      const errorText = document.getElementById('error-text');
      const form = document.getElementById('login-form');

      if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
        errorDiv.classList.add('hidden');
        sessionStorage.setItem('raga_admin_auth', 'true');
        sessionStorage.setItem('raga_admin_user', username);
        const btn = document.getElementById('submit-btn');
        btn.textContent = 'Signing in...';
        btn.disabled = true;
        setTimeout(() => { window.location.href = 'admin.html'; }, 600);
      } else {
        errorDiv.classList.remove('hidden');
        if (!username) {
          errorText.textContent = 'Please enter your username.';
        } else if (!password) {
          errorText.textContent = 'Please enter your password.';
        } else {
          errorText.textContent = 'Invalid username or password. Please try again.';
        }
        form.classList.add('shake');
        setTimeout(() => form.classList.remove('shake'), 400);
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }

    function togglePassword() {
      const p = document.getElementById('password');
      const s = document.getElementById('eye-icon-show');
      const h = document.getElementById('eye-icon-hide');
      if (p.type === 'password') {
        p.type = 'text'; s.classList.add('hidden'); h.classList.remove('hidden');
      } else {
        p.type = 'password'; s.classList.remove('hidden'); h.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
